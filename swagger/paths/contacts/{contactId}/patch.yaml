tags: [Contacts]
summary: Update an existing contact
operationId: updateContact
description: Update contact fields. Supports **multipart/form-data** for optional **photo**.
security:
  - bearerAuth: []
parameters:
  - $ref: '../../../../docs/openapi.yaml#/components/parameters/contactId'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../../../docs/openapi.yaml#/components/schemas/ContactUpdate'
responses:
  '200':
    description: Contact updated
    content:
      application/json:
        schema:
          $ref: '../../../../docs/openapi.yaml#/components/schemas/ContactResponse'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../../docs/openapi.yaml#/components/schemas/ErrorResponse'
